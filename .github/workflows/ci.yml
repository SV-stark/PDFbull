name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run Format Check
        run: cargo fmt --check

  clippy:
    name: Clippy Lints
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Fetch PP-OCRv6 Multilingual Models (.onnx)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "models"
          foreach ($m in @(
              @{ File = "models/PP-OCRv6_small_det.onnx"; Url = "https://raw.githubusercontent.com/ShareX/ShareX/develop/ShareX.OCR/Models/PP-OCRv6_small_det/inference.onnx" },
              @{ File = "models/PP-OCRv6_small_rec.onnx"; Url = "https://raw.githubusercontent.com/ShareX/ShareX/develop/ShareX.OCR/Models/PP-OCRv6_small_rec/inference.onnx" }
          )) {
              if (-not (Test-Path $m.File) -or (Get-Item $m.File).Length -lt 1000000) {
                  Write-Host "Downloading $($m.File)..."
                  Invoke-WebRequest -Uri $m.Url -OutFile $m.File
              }
          }

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Run Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Fetch PP-OCRv6 Multilingual Models (.onnx)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "models"
          foreach ($m in @(
              @{ File = "models/PP-OCRv6_small_det.onnx"; Url = "https://raw.githubusercontent.com/ShareX/ShareX/develop/ShareX.OCR/Models/PP-OCRv6_small_det/inference.onnx" },
              @{ File = "models/PP-OCRv6_small_rec.onnx"; Url = "https://raw.githubusercontent.com/ShareX/ShareX/develop/ShareX.OCR/Models/PP-OCRv6_small_rec/inference.onnx" }
          )) {
              if (-not (Test-Path $m.File) -or (Get-Item $m.File).Length -lt 1000000) {
                  Write-Host "Downloading $($m.File)..."
                  Invoke-WebRequest -Uri $m.Url -OutFile $m.File
              }
          }

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run Tests
        run: cargo nextest run

      - name: Check Benchmarks
        run: cargo check --benches

  security:
    name: Security & License Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check dependency advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

