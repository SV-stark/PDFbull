name: Stable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Fetch PP-OCRv6 Multilingual Models (.onnx)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "models"
          $models = @(
              @{
                  File = "models/PP-OCRv6_small_det.onnx"
                  Urls = @(
                      "https://raw.githubusercontent.com/ShareX/ShareX/develop/ShareX.OCR/Models/PP-OCRv6_small_det/inference.onnx",
                      "https://github.com/SV-stark/PDFbull/releases/download/models/PP-OCRv6_small_det.onnx"
                  )
              },
              @{
                  File = "models/PP-OCRv6_small_rec.onnx"
                  Urls = @(
                      "https://raw.githubusercontent.com/ShareX/ShareX/develop/ShareX.OCR/Models/PP-OCRv6_small_rec/inference.onnx",
                      "https://github.com/SV-stark/PDFbull/releases/download/models/PP-OCRv6_small_rec.onnx"
                  )
              }
          )

          foreach ($m in $models) {
              if (-not (Test-Path $m.File) -or (Get-Item $m.File).Length -lt 1000000) {
                  $downloaded = $false
                  foreach ($url in $m.Urls) {
                      try {
                          Write-Host "Downloading $($m.File) from $url..."
                          Invoke-WebRequest -Uri $url -OutFile $m.File -ErrorAction Stop
                          if ((Test-Path $m.File) -and (Get-Item $m.File).Length -gt 1000000) {
                              $downloaded = $true
                              Write-Host "Successfully downloaded $($m.File) ($( (Get-Item $m.File).Length ) bytes)."
                              break
                          }
                      } catch {
                          Write-Warning "Failed to download from $url - $_"
                      }
                  }
                  if (-not $downloaded) {
                      Write-Error "Failed to obtain $($m.File) from all available sources!"
                      exit 1
                  }
              } else {
                  Write-Host "$($m.File) already present ($( (Get-Item $m.File).Length ) bytes)."
              }
          }

      - name: Run Tests
        run: cargo test

      - name: Build PDFbull (Release)
        run: cargo build --release

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_dist/models"
          Copy-Item -Path "target/release/pdfbull.exe" -Destination "release_dist/"
          Copy-Item -Path "models/*" -Destination "release_dist/models/"
          Compress-Archive -Path release_dist/* -DestinationPath "PDFbull-Portable.zip"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Persist NSIS to PATH for all subsequent steps via GITHUB_PATH
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate NSIS GUI Assets
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python -c "
          from PIL import Image, ImageDraw
          import os

          os.makedirs('installer_assets', exist_ok=True)
          wbmp = Image.new('RGB', (164, 314), color=(15, 17, 26))
          draw = ImageDraw.Draw(wbmp)
          for y in range(314):
              r = int(15 + (35 - 15) * (y / 314))
              g = int(17 + (40 - 17) * (y / 314))
              b = int(26 + (65 - 26) * (y / 314))
              draw.line([(0, y), (164, y)], fill=(r, g, b))
          draw.line([(0, 0), (164, 0)], fill=(99, 102, 241), width=3)
          draw.line([(0, 313), (164, 313)], fill=(16, 185, 129), width=2)

          if os.path.exists('PDFbull.png'):
              logo = Image.open('PDFbull.png').convert('RGBA')
              logo.thumbnail((96, 96), Image.Resampling.LANCZOS)
              wbmp.paste(logo, ((164 - logo.width) // 2, 40), logo)

          wbmp.save('installer_assets/welcome.bmp', 'BMP')

          hbmp = Image.new('RGB', (150, 57), color=(22, 27, 34))
          hdraw = ImageDraw.Draw(hbmp)
          for x in range(150):
              r = int(22 + (40 - 22) * (x / 150))
              g = int(27 + (45 - 27) * (x / 150))
              b = int(34 + (70 - 34) * (x / 150))
              hdraw.line([(x, 0), (x, 57)], fill=(r, g, b))

          if os.path.exists('PDFbull.png'):
              hlogo = Image.open('PDFbull.png').convert('RGBA')
              hlogo.thumbnail((44, 44), Image.Resampling.LANCZOS)
              hbmp.paste(hlogo, (150 - hlogo.width - 6, (57 - hlogo.height) // 2), hlogo)

          hbmp.save('installer_assets/header.bmp', 'BMP')
          "

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          makensis installer.nsi
          if (-not (Test-Path "PDFbull-Setup.exe")) {
            Write-Error "PDFbull-Setup.exe was not produced by NSIS!"
            exit 1
          }
          Write-Host "Installer built successfully: $(Get-Item PDFbull-Setup.exe | Select-Object -ExpandProperty Length) bytes"

      - name: Create Stable Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Release ${{ github.ref_name }}
          body: 'Stable release of PDFbull.'
          fail_on_unmatched_files: true
          files: |
            release_dist/pdfbull.exe
            PDFbull-Setup.exe
            PDFbull-Portable.zip
          draft: false
          prerelease: false


