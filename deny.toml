# Configuration for cargo-deny

[advisories]
version = 2
unmaintained = "all"
yanked = "warn"
ignore = [
    "RUSTSEC-2024-0370", # proc-macro-error is unmaintained (transitive via fmt-derive/winprint)
    "RUSTSEC-2023-0071", # rsa Marvin Attack timing sidechannel (transitive via zpdf)
    "RUSTSEC-2026-0206", # rustybuzz is unmaintained (transitive via usvg/iced)
    "RUSTSEC-2026-0192", # ttf-parser is unmaintained (transitive via fontdb/zpdf)
    "RUSTSEC-2024-0436", # paste unmaintained (transitive via wgpu/image)
    "RUSTSEC-2024-0384", # instant unmaintained (transitive via gpui-kit -> gpui-base)
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained (transitive via gpui-kit-assets -> gpui-pre-reqwest)
    "RUSTSEC-2026-0371", # zbus_names unmaintained (Linux only: gpui-kit -> accesskit_unix -> atspi)
    "RUSTSEC-2026-0370", # zvariant unmaintained (Linux only: same zbus/atspi chain)
    "RUSTSEC-2026-0372", # zvariant_derive unmaintained (Linux only: same zbus/atspi chain)
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "IJG",
    "NCSA",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
