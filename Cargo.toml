[package]
name = "pdfbull"
version = "0.16.5"
description = "A lightweight PDF reader"
authors = ["SV-stark"]
edition = "2024"
resolver = "3"
rust-version = "1.90" # edition 2024 + let-chains
license = "MIT"
homepage = "https://github.com/SV-stark/PDFbull"
repository = "https://github.com/SV-stark/PDFbull"
exclude = [
    "models/*",
    "installer_assets/*",
    "docs/*",
    "scorecard.png",
    "plan-dist-manifest.json",
    "dist-*.log",
    "target_err.log",
    "installer.nsi",
]

[dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit" }
image = { version = "0.25", default-features = false }
zpdf = { version = "=0.14.0", features = ["cpu-render"] }
zpdf-writer = "=0.14.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "time", "process", "fs", "io-util", "macros"] }
rfd = "0.17"
zune-image = "0.5"
zune-core = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6"
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
open = "5"
thiserror = "2.0"
arboard = "3"
lopdf = "0.44"
pdf-writer = "0.15"
csscolorparser = "0.8"
timeago = "0.6"
tempfile = "3"
oxipng = { version = "10.2", default-features = false, features = ["parallel"] }
time = { version = "0.3.47", features = ["serde", "formatting", "macros"] }
quick_cache = "0.7"
mimalloc = "0.1"
human-panic = "2.0"
notify-debouncer-full = "0.7"
interprocess = { version = "2", features = ["tokio"] }
crossbeam-channel = "0.5.15"
ocrs = "0.12.2"
rten = { version = "0.24.0", features = ["mmap", "rten_format"] }
nucleo-matcher = "0.3"
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
winprint = { version = "0.2.1", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security_Cryptography",
] }

[features]
default = ["cpu-render"]
cpu-render = ["zpdf/cpu-render"]



[dev-dependencies]
insta = { version = "1.46.3", features = ["redactions"] }
divan = "0.1.14"

[build-dependencies]
winresource = "0.1"

[[bench]]
name = "render_bench"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }

# The profile that 'dist' will build with.
#
# NOTE: `panic` is deliberately left as the default ("unwind"). The engine wraps
# every command in `catch_worker_panic` (see src/engine.rs) and src/main.rs
# installs a panic hook that writes a crash report, but `catch_unwind` cannot
# observe a panic under `panic = "abort"` — a single panic inside zpdf/lopdf
# would take the whole app down with no report. Unwinding costs a negligible
# amount of code size here and keeps that safety net real.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
lto = "fat"
strip = true



