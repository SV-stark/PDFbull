[package]
name = "pdfbull"
version = "0.13.5"
description = "A lightweight PDF reader"
authors = ["SV-stark"]
edition = "2024"
resolver = "3"
license = "MIT"
homepage = "https://github.com/SV-stark/PDFbull"
repository = "https://github.com/SV-stark/PDFbull"
exclude = [
    "models/*",
    "installer_assets/*",
    "docs/*",
    "scorecard.png",
    "plan-dist-manifest.json",
    "dist-*.log",
    "target_err.log",
    "installer.nsi",
]

[dependencies]
iced = { version = "0.14", features = ["image", "svg", "canvas", "tokio", "advanced"] }
zpdf = { version = "0.12.1", features = ["cpu-render"] }
zpdf-writer = "0.12.1"
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "time", "process", "fs", "io-util", "macros"] }
rfd = "0.17"
zune-image = "0.5"
zune-core = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6"
rayon = "1.10"
dark-light = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
open = "5"
thiserror = "2.0"
arboard = "3"
lopdf = "0.44"
pdf-writer = "0.15"
csscolorparser = "0.8"
timeago = "0.6"
tempfile = "3"
oxipng = { version = "10.2", default-features = false, features = ["parallel"] }
time = { version = "0.3", features = ["serde", "formatting", "macros"] }
quick_cache = "0.7"
mimalloc = "0.1"
human-panic = "2.0"
notify-debouncer-full = "0.7"
interprocess = { version = "2", features = ["tokio"] }
crossbeam-channel = "0.5.15"
ocrs = "0.12.2"
rten = { version = "0.24.0", features = ["mmap", "rten_format"] }
nucleo-matcher = "0.3"
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
winprint = { version = "0.2.1", default-features = false }
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[features]
default = ["cpu-render"]
cpu-render = ["zpdf/cpu-render"]



[dev-dependencies]
iced_test = "0.14"
insta = { version = "1.46.3", features = ["redactions"] }
divan = "0.1.14"

[build-dependencies]
winresource = "0.1"

[[bench]]
name = "render_bench"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }

# The profile that 'dist' will build with
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
lto = "thin"
strip = true
panic = "abort"



