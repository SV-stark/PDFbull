[package]
name = "pdfbull"
version = "0.22.0"
description = "A lightweight PDF reader"
authors = ["SV-stark"]
edition = "2024"
resolver = "3"
rust-version = "1.90" # edition 2024 + let-chains
license = "MIT"
repository = "https://github.com/SV-stark/PDFbull"
exclude = [
    "models/*.onnx",
    "installer_assets/*",
    "docs/*",
    "scorecard.png",
    "plan-dist-manifest.json",
    "dist-*.log",
    "target_err.log",
    "installer.nsi",
]

[package.metadata.wix]
upgrade-guid = "1B237900-04FB-481F-9D5D-F0EDF9509BB5"
path-guid = "6809003F-8E5F-44E1-99F7-FE7E2B2FA137"
license = false
eula = false

[dependencies]
gpui-kit = { version = "0.11.0", default-features = false, features = ["component", "assets", "gpui-fast"] }
image = { version = "0.25", default-features = false }
zpdf = { version = "=0.23.0", features = ["cpu-render"] }
zpdf-writer = { version = "=0.23.0", features = ["timestamp"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros"] }
rfd = "0.17"
zune-image = "0.5"
zune-core = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6"
rayon = "1.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2.0"
arboard = "3"
# JBIG2 encoder for the bilevel tier of image optimization. `decode` is off: we
# only ever encode (zpdf already decodes JBIG2 on the read path), and dropping
# it keeps ndarray/bitvec decode code out of the binary.
jbig2enc-rust = { version = "0.5.4", default-features = false, features = ["encode", "symboldict", "parallel"] }
# Content-stream tokenizer, for reading image placement (`cm` / `Do`) when
# deriving effective DPI. `zpdf` re-exports the crate's high-level helpers but
# not its tokenizer, and its interpreter reports a display-list-local image id
# rather than the object id needed to rewrite a stream. Pinned to the exact
# version `zpdf` 0.23.0 depends on so both see one copy of the types.
zpdf-content = "=0.23.0"
# `parse_resource_dict`, for reading a Form XObject's own /Resources when
# following a scan nested inside a form. Pinned to the exact version `zpdf`
# 0.23.0 depends on so both see one copy of the types.
zpdf-document = "=0.23.0"
zpdf-image = "=0.23.0"
zpdf-svg-export = "=0.23.0"
timeago = "0.6"
tempfile = "3"
oxipng = { version = "10.2", default-features = false, features = ["parallel", "zopfli"] }
time = { version = "0.3.55", features = ["serde", "formatting", "macros"] }
quick_cache = "0.7"
mimalloc = "0.1"
human-panic = "2.0"
interprocess = "2"
crossbeam-channel = "0.5.17"
ocrs = { version = "0.13.1", default-features = false }
rten = { version = "0.26.0", features = ["mmap", "rten_format", "onnx_format"] }
nucleo-matcher = "0.3"
# Inflates comic-book (.cbz) archive entries.
flate2 = "1.1"
zeroize = { version = "1.9", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
winprint = { version = "0.3.0", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
] }

[features]
default = ["cpu-render"]
cpu-render = ["zpdf/cpu-render"]



[dev-dependencies]
insta = { version = "1.49.0", features = ["redactions"] }
divan = "0.1.21"
gpui-kit = { version = "0.11.0", default-features = false, features = ["component", "assets", "gpui-fast", "test-support"] }

[build-dependencies]
winresource = "0.1"

[[bench]]
name = "render_bench"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }

# The profile that 'dist' will build with.
#
# NOTE: `panic` is deliberately left as the default ("unwind"). The engine wraps
# every command in `catch_worker_panic` (see src/engine.rs) and src/main.rs
# installs a panic hook that writes a crash report, but `catch_unwind` cannot
# observe a panic under `panic = "abort"` — a single panic inside zpdf
# would take the whole app down with no report. Unwinding costs a negligible
# amount of code size here and keeps that safety net real.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
lto = "fat"
strip = true

# Avoid MSVC link.exe PDB crash / heap exhaustion (LNK1318 / LNK1102)
[profile.dev]
debug = false

[profile.dev.package."*"]
debug = false



